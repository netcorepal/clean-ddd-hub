site_name: CleanDDD 文档
site_url: https://docs.cleanddd.com/
site_description: CleanDDD 文档
site_author: NetCorePal

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  logo: assets/logo.png
  palette:
    - scheme: default
      primary: grey
      accent: grey
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables

plugins:
  - search
  - i18n:
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            什么是 CleanDDD: What is CleanDDD

extra_css:
  - stylesheets/engineering.css

nav:
  - 什么是 CleanDDD: index.md

extra:
  homepage: /
  alternate:
    - name: 简体中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/netcorepal
