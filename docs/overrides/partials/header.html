{% set home_url = config.extra.homepage or base_url %}
<header class="md-header docs-header" data-md-component="header">
  <div class="docs-header__inner">
    <a class="docs-header__logo" href="{{ home_url }}" aria-label="Clean DDD">
      <img src="{{ base_url }}/assets/logo.png" alt="Clean DDD Logo" />
      <span>Clean DDD</span>
    </a>
    <nav class="docs-header__nav" aria-label="Primary">
      <a href="{{ home_url }}">首页</a>
      <a href="{{ base_url }}/">知识库</a>
      <a href="{{ home_url }}frameworks">框架</a>
      <a href="{{ home_url }}events">活动</a>
      <a class="docs-header__cta" href="{{ home_url }}">加入社区</a>
      <a href="https://github.com/netcorepal" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </div>
</header>
